name: Linux AppImage

# Builds Distill for Linux on GitHub's Ubuntu runners, so a Linux build can be made without owning a Linux machine.
# Every push and every manual run leaves a downloadable AppImage in the run's "Artifacts" section.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_unittest.py --timeout 180 -- python -m unittest discover -s tests -t .

      - name: Build the bundle
        run: pyinstaller --noconfirm distill-linux.spec

      - name: Package the AppImage
        run: |
          set -euo pipefail
          curl -sL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          rm -rf AppDir
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp -r dist/Distill AppDir/Distill
          cp packaging/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
          cp packaging/distill.desktop AppDir/distill.desktop
          cp packaging/distill.desktop AppDir/usr/share/applications/distill.desktop
          cp distill.png AppDir/distill.png
          cp distill.png AppDir/usr/share/icons/hicolor/256x256/apps/distill.png
          # No FUSE on a runner, so appimagetool unpacks itself instead of mounting.
          cd /tmp && APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream "$GITHUB_WORKSPACE/AppDir" "$GITHUB_WORKSPACE/Distill-x86_64.AppImage"
          cd "$GITHUB_WORKSPACE"
          sha256sum Distill-x86_64.AppImage > Distill-x86_64.AppImage.sha256
          cat Distill-x86_64.AppImage.sha256

      - name: Smoke test the packaged app
        # The same check the Windows build runs: start the real program and make it build its window.
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/distill-config" XDG_DATA_HOME="$RUNNER_TEMP/distill-data"
          export XDG_STATE_HOME="$RUNNER_TEMP/distill-state" XDG_CACHE_HOME="$RUNNER_TEMP/distill-cache"
          export APPIMAGE_EXTRACT_AND_RUN=1
          QT_QPA_PLATFORM=offscreen ./Distill-x86_64.AppImage --self-test /tmp/report.txt
          cat /tmp/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Distill-AppImage
          path: |
            Distill-x86_64.AppImage
            Distill-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
