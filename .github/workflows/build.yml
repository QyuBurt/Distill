name: Build Distill Windows Executable

on:
  push:
    branches: [ "master", "main" ] # Triggers automatically on push
  workflow_dispatch: # Adds a button in GitHub to manually trigger the build

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Use your exact Python version here
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Distill with PyInstaller
      # --noconfirm: Overwrites existing builds without pausing
      # --onefile: Packages everything into a single .exe
      # --windowed: Hides the background console window (crucial for Qt apps)
      # --add-data: Bundles your emulators.json file (Windows uses ; as the separator)
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "emulators.json;." --name "Distill" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Distill-Windows
        path: dist/Distill.exe
        retention-days: 7